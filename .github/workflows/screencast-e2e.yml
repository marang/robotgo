name: ScreenCast E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      desktop:
        description: Hosted desktop lane to run
        required: true
        default: gnome
        type: choice
        options:
          - gnome
          - kde
          - all

concurrency:
  group: screencast-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hosted-portal:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: GitHub-hosted ${{ matrix.desktop }} persistent capture
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        desktop: >-
          ${{
            fromJSON(
              github.event_name == 'push' && '["gnome","kde"]' ||
              inputs.desktop == 'all' && '["gnome","kde"]' ||
              inputs.desktop == 'kde' && '["kde"]' ||
              '["gnome"]'
            )
          }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.x
      - name: Verify exact hosted source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Enable hosted KVM
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Install hosted QEMU dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cloud-image-utils \
            openssh-client \
            qemu-system-x86 \
            qemu-utils
      - name: Verify hosted capacity
        shell: bash
        run: |
          set -euo pipefail
          manifest="infrastructure/portal-runner/${{ matrix.desktop }}/manifest.json"
          required_cpus="$(jq -r '.vm.cpus' "$manifest")"
          required_memory_kib="$(( $(jq -r '.vm.memory_mib' "$manifest") * 1024 ))"
          available_memory_kib="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
          minimum_free_bytes="$(( 8 * 1024 * 1024 * 1024 ))"
          available_bytes="$(df --output=avail -B1 "$RUNNER_TEMP" | tail -n 1)"
          test "$(nproc)" -ge "$required_cpus"
          test "$available_memory_kib" -ge "$required_memory_kib"
          test "$available_bytes" -ge "$minimum_free_bytes"
      - name: Build and test nested portal desktop
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          state_root="$RUNNER_TEMP/robotgo-${{ matrix.desktop }}-portal-runner"
          manifest="infrastructure/portal-runner/${{ matrix.desktop }}/manifest.json"
          go run ./internal/cmd/portalrunner validate \
            -manifest "$manifest" \
            -repository-root "$GITHUB_WORKSPACE" \
            -state-root "$state_root"
          go run ./internal/cmd/portalrunner build \
            -manifest "$manifest" \
            -repository-root "$GITHUB_WORKSPACE" \
            -state-root "$state_root"
          go run ./internal/cmd/portalrunner hosted-run \
            -manifest "$manifest" \
            -repository-root "$GITHUB_WORKSPACE" \
            -state-root "$state_root" \
            -commit "$GITHUB_SHA" \
            -cell screencast
      - name: Reject transient runner artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          state_root="$RUNNER_TEMP/robotgo-${{ matrix.desktop }}-portal-runner"
          if [ -d "$state_root" ]; then
            leftover="$(
              find "$state_root" -maxdepth 1 -type d -name 'run-*' -print -quit
            )"
            test -z "$leftover"
          fi
