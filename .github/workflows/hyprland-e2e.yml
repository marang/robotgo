name: Hyprland E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: hyprland-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hyprland-window:
    name: hyprland-window
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.x
      - name: Verify exact hosted source
        shell: bash
        run: |
          set -euo pipefail
          approved_commit='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$approved_commit"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Enable one isolated virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            "linux-modules-extra-$(uname -r)"
          sudo modprobe vkms
          mapfile -t vkms_cards < <(
            for card in /sys/class/drm/card[0-9]*; do
              test -e "$card" || continue
              driver="$(readlink -f "$card/device/driver")"
              if [ "${driver##*/}" = vkms ]; then
                printf '%s\n' "/dev/dri/${card##*/}"
              fi
            done
          )
          test "${#vkms_cards[@]}" -eq 1
          vkms_device="${vkms_cards[0]}"
          test -c "$vkms_device"
          test ! -L "$vkms_device"
          sudo chmod 0666 "$vkms_device"
          test -r "$vkms_device"
          test -w "$vkms_device"
          printf 'ROBOTGO_HYPRLAND_DRM_DEVICE=%s\n' "$vkms_device" >>"$GITHUB_ENV"
          printf 'ROBOTGO_HYPRLAND_DRM_DRIVER=vkms\n' >>"$GITHUB_ENV"
      - name: Build pinned Hyprland runner
        shell: bash
        run: |
          set -euo pipefail
          image="robotgo-hyprland-e2e:${{ github.event.pull_request.head.sha || github.sha }}"
          docker build --pull \
            --file infrastructure/hyprland-runner/Containerfile \
            --tag "$image" \
            .
          printf 'ROBOTGO_HYPRLAND_IMAGE=%s\n' "$image" >>"$GITHUB_ENV"
      - name: Verify induced-failure cleanup
        env:
          ROBOTGO_APPROVED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          supervisor_log="$RUNNER_TEMP/hyprland-cleanup-supervisor.log"
          set +e
          ./scripts/run-hyprland-container.sh \
            "$ROBOTGO_HYPRLAND_IMAGE" induced-failure \
            >"$supervisor_log" 2>&1
          status=$?
          set -e
          rm -f -- "$supervisor_log"
          test "$status" -eq 86
          reason_file="$RUNNER_TEMP/hyprland-hyprland-window-failure-reason"
          reason="$(./scripts/read-hyprland-failure-reason.sh \
            "$RUNNER_TEMP" "$reason_file")"
          test "$reason" = \
            'isolated Hyprland evidence failed at sanitized stage: induced-failure'
          rm -f -- "$reason_file"
          if compgen -G "$RUNNER_TEMP/robotgo-hyprland-runtime.*" >/dev/null; then
            echo 'induced failure retained an isolated Hyprland runtime' >&2
            exit 1
          fi
      - name: Run isolated Hyprland evidence
        env:
          ROBOTGO_APPROVED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          supervisor_log="$RUNNER_TEMP/hyprland-supervisor.log"
          set +e
          ./scripts/run-hyprland-container.sh "$ROBOTGO_HYPRLAND_IMAGE" \
            >"$supervisor_log" 2>&1
          status=$?
          set -e
          rm -f -- "$supervisor_log"
          if [ "$status" -ne 0 ]; then
            reason_file="$RUNNER_TEMP/hyprland-hyprland-window-failure-reason"
            ./scripts/read-hyprland-failure-reason.sh \
              "$RUNNER_TEMP" "$reason_file" ||
              echo 'isolated Hyprland evidence failed at sanitized stage: unavailable' >&2
            echo 'isolated Hyprland evidence failed; private runtime output was removed' >&2
            exit "$status"
          fi
      - name: Upload compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hyprland-window
          path: |
            ${{ runner.temp }}/hyprland-e2e-hyprland-window/evidence.json
            ${{ runner.temp }}/hyprland-e2e-hyprland-window/test.log
            ${{ runner.temp }}/hyprland-e2e-hyprland-window/summary.md
          if-no-files-found: error
          retention-days: 90
      - name: Remove Hyprland evidence workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rm -f -- \
            "$RUNNER_TEMP/hyprland-cleanup-supervisor.log" \
            "$RUNNER_TEMP/hyprland-supervisor.log" \
            "$RUNNER_TEMP/hyprland-hyprland-window-failure-reason"
          rm -f -- \
            "$RUNNER_TEMP/hyprland-e2e-hyprland-window/raw-test.log" \
            "$RUNNER_TEMP/hyprland-e2e-hyprland-window/.preflight.json" || true
          go run ./internal/cmd/compositorevidence cleanup \
            -runner-temp "$RUNNER_TEMP" \
            -output-dir "$RUNNER_TEMP/hyprland-e2e-hyprland-window"
          docker rm -f \
            "robotgo-hyprland-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-normal" \
            "robotgo-hyprland-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-induced-failure" \
            >/dev/null 2>&1 || true
          if docker ps -a --format '{{.Names}}' | grep -Fx \
            "robotgo-hyprland-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-normal"; then
            echo 'normal Hyprland evidence container survived cleanup' >&2
            exit 1
          fi
          if docker ps -a --format '{{.Names}}' | grep -Fx \
            "robotgo-hyprland-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-induced-failure"; then
            echo 'induced-failure Hyprland evidence container survived cleanup' >&2
            exit 1
          fi
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d \
            -name 'robotgo-hyprland-runtime.*' -exec rm -rf -- {} +
          test -z "$(find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d \
            -name 'robotgo-hyprland-runtime.*' -print -quit)"
          if [ -n "${ROBOTGO_HYPRLAND_IMAGE:-}" ]; then
            docker image rm -f "$ROBOTGO_HYPRLAND_IMAGE" >/dev/null 2>&1 || true
          fi
          if grep -q '^vkms ' /proc/modules; then
            sudo modprobe -r vkms
          fi
          if grep -q '^vkms ' /proc/modules; then
            echo 'vkms survived Hyprland evidence cleanup' >&2
            exit 1
          fi
